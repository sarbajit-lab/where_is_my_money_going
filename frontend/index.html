<!doctype html>
<html lang="en-IN">
<head>

  <title>WIMMG - Where Is My Money Going?</title>

  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">

        <span class="brand-name">WIMMG<small>Where is my money going?</small></span>

        <a href="#/limits" data-route="limits"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Items &amp; limits</a>
        <a href="#/insights" data-route="insights"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></span>Insights</a>
        <a href="#/transfer" data-route="transfer"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></span>Import &amp; export</a>
        <div class="nav-group">Classic account book</div>
        <a href="#/dashboard" data-route="dashboard"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>Dashboard</a>
        <a href="#/entries" data-route="entries"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15M15 4l4 4-4 4"/><path d="M20 16H5M9 12l-4 4 4 4"/></svg></span>Transactions</a>

    <main class="main">
      <div id="view" class="view" aria-live="polite"></div>
    </main>

  <a class="fab" href="#/add" aria-label="Add transaction">+</a>
  <div id="toast" class="toast" role="status"></div>
  <div id="chart-tip" class="chart-tip"></div>
  <div id="modal-root"></div>
  <script type="module" src="/js/main.js"></script>

</html>
